
# Workflow to update all Dockerfiles when a new version of Caddy is available
# and create a new release and tag
name: Update Dockerfiles, tag and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - caddy-cloudflare/Dockerfile

env:
  CADDY_BUILDS: |
    caddy-netcup-duckdns
    caddy-netcup-duckdns-dockerproxy
    caddy-netcup-duckdns-dockerproxy-layer4-replace-geoip

jobs:
  metadata:
    name: Get updated Caddy version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Parse Caddy version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            grep -oE 'caddy:[0-9]+\.[0-9]+\.[0-9]+' caddy-cloudflare/Dockerfile |
            head -1 |
            cut -d ':' -f2
          )"

          if [[ -z "$version" ]]; then
            echo "Could not determine Caddy version from caddy-cloudflare/Dockerfile"
            exit 1
          fi

          echo "Detected Caddy version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  update:
    name: Update Caddy and create tag
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          ref: main

      - name: Replace Caddy version in all Dockerfiles
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"

          for caddy_build in $CADDY_BUILDS; do
            dockerfile="./$caddy_build/Dockerfile"

            if [[ ! -f "$dockerfile" ]]; then
              echo "Dockerfile not found: $dockerfile"
              exit 1
            fi

            sed -i -E \
              "s/caddy:[0-9]+\.[0-9]+\.[0-9]+/caddy:${version}/g" \
              "$dockerfile"

            sed -i -E \
              "s/CADDY_VERSION=[0-9]+\.[0-9]+\.[0-9]+/CADDY_VERSION=${version}/g" \
              "$dockerfile"
          done

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"

          if git diff --quiet -- ./*/Dockerfile; then
            echo "No changes detected"
          else
            git add ./*/Dockerfile
            git commit -S \
              -m "Bump Caddy version to v${version} in all Dockerfiles"
            git push
          fi

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi

          git tag -s "$tag" \
            -m "Docker images built with Caddy v${version}"

          git push origin "$tag"

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - update

    steps:
      - name: Generate release text
        id: release_text
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'text<<EOF'

            for caddy_build in $CADDY_BUILDS; do
              echo "- **${caddy_build}** v${VERSION}: [Source](https://github.com/mwitasse/caddy-custom-builds/tree/main/${caddy_build}) / [GitHub Package](https://ghcr.io/mwitasse/${caddy_build}) / [Docker Hub](https://hub.docker.com/r/mwitassek/${caddy_build})"
            done

            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          body: |
            Caddy release notes: https://github.com/caddyserver/caddy/releases/tag/v${{ needs.metadata.outputs.version }}

            Custom builds:
            ${{ steps.release_text.outputs.text }}

