# Workflow to build and push a Docker image to Docker Hub and GitHub Container Registries
name: Build caddy-cloudflare

# Controls when the action will run
on:
  workflow_dispatch:  # allows to run the workflow manually from the Actions tab
  schedule:
    - cron: '0 0 1 * *'  # runs at 00:00 on the first day of every month
  push:
    branches: main
    paths:
      - caddy-cloudflare/Dockerfile

# Environment variables available to all jobs and steps in this workflow
env:
  DOCKER_BUILDKIT: 1
  DOCKER_NAME: caddy-cloudflare
  DOCKER_DESCRIPTION: "Caddy Docker custom build with Cloudflare modules"


jobs:
  metadata:
    name: Get image and repository details
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      labels: ${{ steps.metadata.outputs.labels }}
      build_time: ${{ steps.build_time.outputs.build_time }}
      platforms: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Caddy version from Dockerfile ARG
        id: version
        run: echo "version=$(grep -E '^ARG CADDY_VERSION=' $DOCKER_NAME/Dockerfile | head -1 | cut -d '=' -f2)" | tee -a $GITHUB_OUTPUT


      - name: Set build number
        id: build_time
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y%m%d%H%M%S)"
          echo "Build number: $build_time"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ env.DOCKER_NAME }}
            org.opencontainers.image.description=${{ env.DOCKER_DESCRIPTION }}

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ./${{ env.DOCKER_NAME }}/Dockerfile
          push: true
          provenance: false
          platforms: ${{ needs.metadata.outputs.platforms }}
          build-args: |
            CADDY_VERSION=${{ needs.metadata.outputs.version }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build_time }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:latest
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build_time }}
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:latest
          labels: ${{ needs.metadata.outputs.labels }}

  release:
    name: Create GitHub Release with build info
    runs-on: ubuntu-latest
    needs: [metadata, build]

    env:
      RELEASE_TAG: v${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build_time }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract build info from container
        id: buildinfo
        run: |
          # Pull the built image
          docker pull ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:${{ env.RELEASE_TAG }}
          
          # Create temporary container and extract build info
          CONTAINER_ID=$(docker create ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:${{ env.RELEASE_TAG }})
          
          # Extract the build info files
          docker cp $CONTAINER_ID:/tmp/caddy-version.txt ./caddy-version.txt || echo "Caddy version info not available" > ./caddy-version.txt
          docker cp $CONTAINER_ID:/tmp/caddy-modules.txt ./caddy-modules.txt || echo "Module info not available" > ./caddy-modules.txt
          
          # Clean up container
          docker rm $CONTAINER_ID
          
          # Create release notes
          echo "# Caddy Custom Build ${{ env.RELEASE_TAG }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Build Information" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Caddy Version" >> release-notes.md
          echo '```' >> release-notes.md
          cat caddy-version.txt >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "### Loaded Modules" >> release-notes.md
          echo '```' >> release-notes.md
          cat caddy-modules.txt >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "## Docker Images" >> release-notes.md
          echo "- \`docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:${{ env.RELEASE_TAG }}\`" >> release-notes.md
          echo "- \`ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:${{ env.RELEASE_TAG }}\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Usage" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "docker run -d --name caddy \\" >> release-notes.md
          echo "  -p 80:80 -p 443:443 \\" >> release-notes.md
          echo "  -v \$PWD/Caddyfile:/etc/caddy/Caddyfile \\" >> release-notes.md
          echo "  -v caddy_data:/data \\" >> release-notes.md
          echo "  ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:${{ env.RELEASE_TAG }}" >> release-notes.md
          echo '```' >> release-notes.md

      - name: Check if release exists
        id: release_exists
        run: |
          if gh release view ${{ env.RELEASE_TAG }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.release_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Caddy Custom Build ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing GitHub Release
        if: steps.release_exists.outputs.exists == 'true'
        run: |
          gh release edit ${{ env.RELEASE_TAG }} \
            --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
