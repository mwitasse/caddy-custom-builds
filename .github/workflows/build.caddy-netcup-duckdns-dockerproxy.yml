# Workflow to build and push a Docker image to Docker Hub and GitHub Container Registry
name: Build caddy-netcup-duckdns-dockerproxy

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 1 * *'

  push:
    branches:
      - main
    paths:
      - caddy-netcup-duckdns-dockerproxy/Dockerfile

env:
  DOCKER_NAME: caddy-netcup-duckdns-dockerproxy
  DOCKER_DESCRIPTION: "Caddy Docker custom build with Netcup DNS, DuckDNS and Docker Proxy modules"

jobs:
  metadata:
    name: Get image metadata
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.metadata.outputs.tags }}
      labels: ${{ steps.metadata.outputs.labels }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Caddy version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            grep -E '^ARG CADDY_VERSION=' "$DOCKER_NAME/Dockerfile" |
            head -1 |
            cut -d '=' -f2 |
            tr -d '[:space:]'
          )"

          if [[ -z "$version" ]]; then
            echo "Error: CADDY_VERSION not found in Dockerfile"
            exit 1
          fi

          echo "Caddy version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ env.DOCKER_NAME }}
            org.opencontainers.image.description=${{ env.DOCKER_DESCRIPTION }}

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.DOCKER_NAME }}/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            CADDY_VERSION=${{ needs.metadata.outputs.version }}
          tags: ${{ needs.metadata.outputs.tags }}
          labels: ${{ needs.metadata.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build

    permissions:
      contents: write
      packages: write

    steps:
      - name: Pull built image
        run: |
          docker pull \
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}

      - name: Extract build information
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(
            docker create \
              ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}
          )"

          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          docker cp "$container_id:/tmp/caddy-version.txt" caddy-version.txt
          docker cp "$container_id:/tmp/caddy-modules.txt" caddy-modules.txt

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Caddy Custom Build v${{ needs.metadata.outputs.version }}

          ## Build Information

          ### Caddy Version

          \`\`\`
          $(cat caddy-version.txt)
          \`\`\`

          ### Loaded Modules

          \`\`\`
          $(cat caddy-modules.txt)
          \`\`\`

          ## Docker Images

          Available on:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

          **Docker Hub**

          \`\`\`bash
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}
          \`\`\`

          **GitHub Container Registry**

          \`\`\`bash
          docker pull ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}
          \`\`\`

          ## Usage

          \`\`\`bash
          docker run -d --name caddy \\
            -p 80:80 -p 443:443 \\
            -v \$PWD/Caddyfile:/etc/caddy/Caddyfile \\
            -v caddy_data:/data \\
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}:v${{ needs.metadata.outputs.version }}
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: Caddy Custom Build v${{ needs.metadata.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false